# ---------------- Database ----------------
db.url=jdbc:mysql://localhost:3306/miniloan?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
db.user=root
db.password=enteryourpassword

# ---------------- Business date ----------------
# Leave blank to use today's date. Format yyyy-MM-dd. Can also be changed from the console menu.
business.date=

# ---------------- General ----------------
application.number.prefix=LN
reviewer.default.code=REV001
output.dir=./output
reports.file=sql/reports.sql

# ---------------- Eligibility rules (editable without recompiling) ----------------
age.min=21
age.max=60
foir.max.percent=50.00
overdue.days=2

# ---------------- PERSONAL ----------------
product.PERSONAL.min.amount=50000
product.PERSONAL.max.amount=500000
product.PERSONAL.min.tenure=12
product.PERSONAL.max.tenure=60
product.PERSONAL.min.income=20000
product.PERSONAL.annual.rate=12.00
product.PERSONAL.coborrower.allowed=true

# ---------------- EDUCATION ----------------
product.EDUCATION.min.amount=100000
product.EDUCATION.max.amount=1000000
product.EDUCATION.min.tenure=12
product.EDUCATION.max.tenure=84
product.EDUCATION.min.income=15000
product.EDUCATION.annual.rate=10.00
product.EDUCATION.coborrower.allowed=false

# ---------------- Schedulers ----------------
scheduler.enabled=true
overdue.schedule.time=09:00
coredata.initial.delay.seconds=10
coredata.poll.interval.seconds=30
